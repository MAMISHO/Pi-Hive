<div class="sidebar-right">
  <div class="tabs">
    <button type="button" class="tab" [class.active]="activeTab==='lineage'" (click)="setTab('lineage')">Task Lineage <span class="tcount">{{ tasks.length }}</span></button>
    <button type="button" class="tab" [class.active]="activeTab==='usage'" (click)="setTab('usage')">Consumo <span class="tcount" *ngIf="usageRuns.length">{{ usageRuns.length }}</span></button>
  </div>

  @if (activeTab === 'lineage') {
    <div class="memory-strip" *ngIf="agents?.length">
      <div class="memory-strip-title" title="pref.: preferencia de memoria activada para el agente, pero no efectiva ahora (global/workspace/MCP no disponible o deshabilitado). efectiva: memoria activa y utilizable. off: sin memoria para este agente.">Memoria por agente</div>
      <div class="memory-strip-list">
        @for (a of agents; track a.id) {
          <div class="mem-agent" [title]="(a.nickname || a.name) + ' · ' + (a.memoryPreference || a.memory_enabled ? (a.memoryEffective ? 'Memoria efectiva: el agente puede usarla ahora.' : 'Preferencia activa (pref.): no efectiva ahora por condiciones global/workspace/MCP.') : 'Memoria desactivada (off) para este agente.')">
            <span class="dot" [style.background]="a.color || 'var(--accent-blue)'"></span>
            <span class="aname">{{ a.nickname || a.name }}</span>
            <span class="pill" [class.on]="a.memoryEffective" [class.off]="!a.memoryEffective">{{ a.memoryPreference || a.memory_enabled ? (a.memoryEffective ? 'efectiva' : 'pref.') : 'off' }}</span>
          </div>
        }
      </div>
    </div>
    <app-lineage
      [tasks]="tasks"
      [agents]="agents"
      (clearRequested)="clearLineage()">
    </app-lineage>
  } @else {
    <app-usage
      [usageRuns]="usageRuns"
      [usageTotals]="usageTotals"
      [agents]="agents">
    </app-usage>
  }
</div>
